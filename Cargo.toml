[package]
name = "vramtui"
version = "0.1.0"
edition = "2021"
description = "GPU landlord for local inference: Ollama and LM Studio on one VRAM bar"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = { version = "0.28", features = ["event-stream"] }
dirs = "6"
futures-util = "0.3"
libc = "0.2"
notify = "8"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
toml = "0.8"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
